function wtStats(l){l=wtSort(l);if(!l.length)return"";const f=+l[0][1],t=+l[l.length-1][1],d=t-f;return`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0"><div class="stat" style="cursor:default"><b>${f}</b><span>Start (kg)</span></div><div class="stat" style="cursor:default"><b>${t}</b><span>Latest (kg)</span></div><div class="stat" style="cursor:default"><b style="color:${d>0?"#c0262d":d<0?"#12a150":"inherit"}">${d>0?"+":""}${d.toFixed(1)}</b><span>Change (kg)</span></div></div>`}
const wtTable=l=>wtSort(l).length?`<table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="text-align:left;color:var(--mut);font-size:12px"><th>DATE</th><th>DAY</th><th>WEIGHT</th></tr>${wtSort(l).slice(-10).reverse().map(x=>{const d=new Date(x[0]+"T00:00:00");return`<tr><td>${d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}</td><td>${d.toLocaleDateString("en-GB",{weekday:"long"})}</td><td><b>${x[1]} kg</b></td></tr>`}).join("")}</table>`:'<p class="msg" style="text-align:center">No weight logged yet.</p>';
const wtb=m=>`<div class="box" style="max-width:520px;margin:0 auto 18px"><b style="font-size:16px">⚖ Daily weight log</b><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input data-wk="${esc(m.id)}" type="number" step="0.1" min="20" max="300" inputmode="decimal" placeholder="Weight (kg)" style="flex:1;min-width:120px"><input data-wd="${esc(m.id)}" type="date" value="${todayS()}" max="${todayS()}" style="flex:1;min-width:140px"><button data-ws="${esc(m.id)}">Save</button></div>${wtStats(m.wt)}${wtChart(m.wt)}${wtTable(m.wt)}</div>`;
const wtRead=m=>{const l=wtm[m.id]||[];return`<div style="margin-top:14px"><b>⚖ Weight log</b>${wtStats(l)}${wtChart(l)}${wtTable(l)}</div>`};
const acts=m=>`<div style="max-width:520px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap"><button data-mi="${esc(m.id)}" style="flex:1 1 220px;background:#17a2b8">⬇ Invoice PDF (with attendance)</button><button data-mid="${esc(m.id)}" style="flex:1 1 150px;background:#2563eb">⬇ ID Card PDF</button></div>`;
const mfull=m=>({...m,bio:m.bio||mbio,phone:m.phone||mphone});
async function saveWeight(id){const k=document.querySelector('[data-wk="'+id+'"]'),dt=document.querySelector('[data-wd="'+id+'"]'),kg=parseFloat(k.value);if(!(kg>=20&&kg<=300))return toast("Enter a weight between 20 and 300 kg");
 try{const r=await post({action:"weight",phone:mphone,bio:mbio,id,kg,date:dt.value});if(r.error)throw new Error(r.error);const m=mmem.find(x=>x.id===id);if(m)m.wt=r.wt;ls.s("rcg_mcache",JSON.stringify(mmem));render();toast("Weight saved ✓")}catch(e){alert(e.message==="auth"?"The weight log needs the latest Google script. Please tell the gym.":"Could not save the weight. Check your internet and try again.")}}
function mcard(m){const i=info(m),c=i.st[1];return`<div class="id" style="cursor:default;max-width:520px;margin:14px auto;border:6px solid ${c};border-radius:22px;box-shadow:0 8px 30px #0003">
<div class="top" style="font-size:15px;padding:10px 18px"><span>RED CROSS GYM</span><span>MEMBER</span></div>
<div style="text-align:center;padding:16px 16px 6px"><img src="${esc(m.photo||"")}" alt="" style="width:min(80vw,340px);aspect-ratio:4/5;object-fit:cover;border-radius:16px;background:var(--bd);border:3px solid ${c}">
<h1 style="margin:14px 0 8px;font-size:clamp(28px,8vw,44px);line-height:1.1">${esc(m.name)}</h1>
<span class="pill" style="background:${c};font-size:clamp(22px,6vw,32px);padding:6px 26px;margin:0">${i.st[0].toUpperCase()}</span>
<div style="margin-top:12px"><b style="font-size:clamp(56px,18vw,96px);line-height:1;color:${c}">${i.left}</b><div style="font-size:clamp(18px,5vw,26px);font-weight:700">days remaining</div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 18px;text-align:center"><div style="background:var(--bg);border-radius:12px;padding:10px"><div class="msg" style="margin:0">JOINING DATE</div><b style="font-size:clamp(17px,4.6vw,24px)">${fmt(pd(m.start))}</b></div><div style="background:var(--bg);border-radius:12px;padding:10px"><div class="msg" style="margin:0">EXPIRY DATE</div><b style="font-size:clamp(17px,4.6vw,24px)">${fmt(pd(m.end))}</b></div></div></div>`}
function adt(x){const[a,b]=x.split(" "),[y,mo,d]=a.split("-").map(Number),[h,mi]=b.split(":").map(Number);return new Date(y,mo-1,d,h,mi)}
function fmtA(x){const d=adt(x);return[d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}),d.toLocaleDateString("en-GB",{weekday:"long"}),d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:true})]}
function astats(list){const pad=n=>String(n).padStart(2,"0"),key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
 const ds=list.map(x=>x.slice(0,10)),set=new Set(ds),now=new Date(),ym=now.getFullYear()+"-"+pad(now.getMonth()+1);
 let c=new Date(now.getFullYear(),now.getMonth(),now.getDate());const today=set.has(key(c));if(!today)c.setDate(c.getDate()-1);let streak=0;while(set.has(key(c))){streak++;c.setDate(c.getDate()-1)}
 return{month:ds.filter(x=>x.startsWith(ym)).length,streak,total:set.size,today}}
function asum(id){const l=(attm[id]||[]).slice().sort().reverse();if(!l.length)return"Attendance: none yet";const s=astats(l),f=fmtA(l[0]);return`Attendance: <b>${s.month}</b> days this month · <b>${s.total}</b> total · streak <b>${s.streak}</b><br>Last visit: <b>${f[1]}, ${f[0]} ${f[2]}</b>`}
function matt(m){const list=(m.att||[]).slice().sort().reverse(),s=astats(list),st=info(m).st[0],od=m.out||{},td=todayS(),tin=list.find(x=>x.slice(0,10)===td),tout=od[td];let top;
 if(s.today&&tin){const f=fmtA(tin),tm=tin.slice(11);
  top=tout?`<div style="background:#2563eb18;border:2px solid #2563eb;border-radius:14px;padding:14px;text-align:center"><div style="font-size:21px;font-weight:800;color:#2563eb">✔ Visit complete</div><div style="font-size:16px;margin-top:4px">In ${t12(tm)} · Out ${t12(tout)} · ${dur(tm,tout)}</div></div>`
   :`<div style="background:#12a15020;border:2px solid #12a150;border-radius:14px;padding:14px;text-align:center"><div style="font-size:22px;font-weight:800;color:#12a150">✔ Checked in at ${f[2]}</div><div style="font-size:15px;margin-top:4px">${f[1]}, ${f[0]}</div></div><button data-mo="${esc(m.id||"")}" style="width:100%;padding:16px;font-size:19px;background:#c0262d;margin-top:10px">⏻ Check out</button>`}
 else if(st==="Expired"||st==="Upcoming")top='<div class="msg" style="text-align:center">Check-in works only while the membership is active.</div>';
 else top=`<button data-mk="${esc(m.id||"")}" style="width:100%;padding:18px;font-size:20px;background:#12a150">✔ Check in</button>`;
 const rows=list.slice(0,15).map(x=>{const f=fmtA(x),k=x.slice(0,10),o=od[k];return`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td><td>${o?t12(o):"—"}</td></tr>`}).join("");
 return`<div class="box" style="max-width:520px;margin:0 auto 18px">${conBox(m,m.att,od)}${top}<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0"><div class="stat"><b>${s.month}</b><span>This month</span></div><div class="stat"><b>${s.streak}</b><span>Day streak</span></div><div class="stat"><b>${s.total}</b><span>Total days</span></div></div>${calWidget("m"+m.id,m.att||[],m.start,m.end)}${rows?`<table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="text-align:left;color:var(--mut);font-size:12px"><th>DATE</th><th>DAY</th><th>IN</th><th>OUT</th></tr>${rows}</table>`:'<p class="msg" style="text-align:center">No attendance yet.</p>'}${payCard(m)}<div style="margin-top:14px;padding:10px 12px;border-radius:12px;background:#181a2008;border:1px dashed var(--bd);font-size:13px;line-height:1.6">🔒 <b>Memberships cannot be paused or frozen.</b><br>⛔ 30 straight days of absence means termination, with no refund.<br>🕒 Only one check-in and one check-out are allowed per day.</div></div>`}
async function markOut(id,btn){btn.disabled=true;btn.textContent="Checking out…";
 try{const r=await post({action:"checkout",phone:mphone,bio:mbio,id});
  if(r.error)alert(r.error==="done"?"Today's visit is already complete. Only one check-out per day.":r.error==="noin"?"You have not checked in today.":r.error==="auth"?"Check-out is not enabled yet. Please tell the gym.":"Could not check out. Please tell the gym.");
  else{const m=mmem.find(x=>x.id===id);if(m){m.att=cleanA(id,r.att);m.out={...outm[id]}}ls.s("rcg_mcache",JSON.stringify(mmem));toast("Checked out ✓")}}
 catch(e){alert("Cannot reach server. Check your internet.")}render()}
async function mark(id,btn){btn.disabled=true;btn.textContent="Checking in…";
 try{const r=await post({action:"attend",phone:mphone,bio:mbio,id});
  if(r.error)alert(r.error==="done"||r.error==="already"?"You have already checked in today. Only one check-in and one check-out per day.":r.error==="expired"?"Membership expired. Please renew.":r.error==="notstarted"?"Membership has not started yet.":r.error==="auth"?"Attendance is not enabled yet. Please tell the gym.":"Could not check in. Please tell the gym.");
  else{const m=mmem.find(x=>x.id===id);if(m){m.att=cleanA(id,r.att);m.out={...outm[id]}}ls.s("rcg_mcache",JSON.stringify(mmem))}}
 catch(e){alert("Cannot reach server. Check your internet.")}render()}

["📜","Membership &amp; Payments",["Memberships are strictly <b>non-transferable</b> and <b>non-refundable</b>.","Memberships are <b>unpausable</b>. A plan cannot be paused, frozen or extended under any circumstance.","Your invoice (PDF or printed receipt) is the only proof and acts as your licence to use the gym within the validity dates printed on it.","Please clear any pending balance within <b>3 days of paying</b>. If it is not cleared in time, the payment may be forfeited, the membership may be terminated and the pending amount may no longer be accepted.","Always verify that the banking name is <b>RED CROSS GYM</b> before paying by UPI, and never pay cash without collecting an official RED CROSS GYM receipt.","Never pay into an employee's or member's personal account. Such payments are unauthorised, the management takes no responsibility for them, and strict legal action will be taken against both sender and receiver.","Students and senior citizens get a flat <b>20% discount</b> on regular plans only, not on any offer price. ID proof is required.","A recent photo of every member is mandatory for the ID card and for identity checks at the desk."]],
["🗓","Attendance &amp; Timings",["Only <b>one check-in and one check-out</b> are allowed per day.","If a member stays absent for <b>30 straight days</b>, the membership may be terminated without refund.","Gym timings are fixed: <b>6:00 AM to 1:00 PM</b> and <b>5:00 PM to 10:00 PM</b> (Unisex), <b>1:00 PM to 5:00 PM</b> (Ladies-Only). Late entries may not be permitted.","Please check the Announcement Group before you leave home for schedule changes, weather disruptions or maintenance."]],
["🏋️","Gym Rules",["Proper gym attire is mandatory: workout clothing and gym shoes.","Use equipment responsibly. Members are liable for damage caused by negligence.","Personal training by outsiders is prohibited. Only certified Red Cross Gym trainers may train members.","Lockers are temporarily unavailable. The gym is not responsible for lost or stolen belongings.","Members must disclose any medical condition. The gym is not liable for injuries, accidents or health issues arising during workouts.","Misconduct, including rude, aggressive or inappropriate behaviour, will result in immediate termination of the membership.","Management may amend rules and policies without prior notice."]],
["🧼","Hygiene Protocol",["Wear clean socks and fresh, fully dried clothes every session.","Use deodorant or fragrance. Body odour is not acceptable in a shared fitness space.","Bring a separate, clean pair of gym-only shoes. No outside shoes inside the gym.","Carry a towel. Wipe off your sweat and wipe the equipment after every set.","Chewing gum is strictly banned in urinals and sanitary areas. Dispose of it responsibly.","A hygiene complaint from staff or a member can lead to immediate termination, with no notice and no refund. If you see a violation, report it to a staff member or in the group."]],

/* ===== photo + due-payment rules ===== */
const hasPh=m=>!!(m&&(m.pv||m.photo)),META={bill:0},DUEMS=3*864e5,dfmt=t=>new Date(t).toLocaleDateString("en-GB",{day:"2-digit",month:"short"});
function dueInfo(m){const a=+m.due||0;if(!(a>0))return null;let t=+m.dueSince||0;if(!t){const p=pd(m.billDate)||pd(m.start);t=p?p.getTime():Date.now()}const dl=t+DUEMS,left=dl-Date.now();return{amt:a,dl,left,over:left<=0,days:Math.ceil(left/864e5),late:Math.floor(-left/864e5)}}
const dueWhen=di=>di.over?(di.late>0?"overdue by "+di.late+" day"+(di.late>1?"s":""):"deadline passed today"):(di.left<864e5?Math.max(1,Math.ceil(di.left/36e5))+"h left":di.days+" day"+(di.days>1?"s":"")+" left");
function dueBanner(m){const di=dueInfo(m);if(!di)return"";const dl=dfmt(di.dl);
 const T=di.over?["⛔ Payment deadline missed"+(di.late>0?" by "+di.late+" day"+(di.late>1?"s":""):""),`Your balance of <b>${inr(di.amt)}</b> was due on ${dl}. Your payment is about to be gone and your membership is on the chopping block 🪓. Clear it at the front desk right now, because we can't promise we'll still accept it tomorrow.`]
 :di.left<864e5?["🚨 Last day to clear "+inr(di.amt),"Pay today, or this payment will be gone, your membership will be terminated and we will not be able to accept the amount after that. Don't be that member 😬"]
 :["⏳ "+inr(di.amt)+" is still pending",`Please clear it within <b>3 days of paying</b> (by <b>${dl}</b>). After that, your payment will be gone, your membership will be terminated and the amount will not be accepted. (A friendly nudge, but we do mean it 😉)`];

function listPart(){const l=members.map(m=>({m,i:info(m)})).filter(x=>(x.m.name+x.m.bio+x.m.phone).toLowerCase().includes(q.toLowerCase())&&(fmatch(x.m,x.i)||(flt==="floor"&&q.trim()))).sort(flt==="floor"?((a,b)=>floorTime(b.m)<floorTime(a.m)?-1:1):flt==="due"?((a,b)=>dueInfo(a.m).left-dueInfo(b.m).left):((a,b)=>a.i.left-b.i.left));return{n:l.length,html:l.slice(0,lim).map(({m,i})=>cardF(m,i)).join("")+(l.length>lim?`<button class="g" id="more" style="grid-column:1/-1">Show more (${l.length-lim})</button>`:"")||'<p class="msg">No members in this list.</p>'}}
function bindCards(){document.querySelectorAll("#lst [data-cd]").forEach(b=>b.onclick=e=>{e.stopPropagation();payDueView(MB[b.dataset.cd])});document.querySelectorAll("#lst [data-fc]").forEach(b=>b.onclick=e=>{e.stopPropagation();floorOp(b.dataset.fc,b.dataset.op,b)});document.querySelectorAll("#lst [data-id]").forEach(el=>el.onclick=()=>detail(el.dataset.id));const mb=$("#more");if(mb)mb.onclick=()=>{lim+=60;const P=listPart();$("#lst").innerHTML=P.html;bindCards()}}
function card(m,i){return`<div class="id" data-id="${esc(m.id)}"><div class="top"><span>RED CROSS GYM</span><span>BIO ${esc(m.bio)}</span></div>
<div class="bd"><img class="ph${hasPh(m)?"":" nop"}" loading="lazy" decoding="async" data-pid="${esc(m.id)}" src="${esc(phs(m)||PHX)}" alt=""><div><h3>${esc(m.name)}</h3><p>${esc(m.phone)}</p><p>${esc(m.plan)}</p><span class="pill" style="background:${i.st[1]}">${i.st[0]}</span></div></div>
<div class="days"><span>${fmt(pd(m.start))} → ${fmt(pd(m.end))}</span><span><b>${i.left}</b> days left</span></div><div class="bar"><i style="width:${i.pct}%;background:${i.st[1]}"></i></div></div>`}
function modal(h){const d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="box">${h}</div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d);return d}

function drawQR(d,url,x,y0,sz,RED,DK){const q=qrObj(url);if(!q)return false;const n=q.getModuleCount(),c=sz/n;for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(q.isDark(i,j)){const f=(i<7&&j<7)||(i<7&&j>=n-7)||(i>=n-7&&j<7);d.setFillColor(...(f?RED:DK));d.rect(x+j*c,y0+i*c,c+.02,c+.02,"F")}return true}
