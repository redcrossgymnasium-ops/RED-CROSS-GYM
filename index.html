<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mut:#6a7280;--red:#d9202e;--red2:#b81a27;--bd:#e8eaf0;--ok:#12a150;--warn:#d98a00;--sh:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(900px 260px at 50% -90px,rgba(217,32,46,.09),transparent),var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:1040px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(1.6) blur(12px);backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--bd);box-shadow:0 1px 0 rgba(217,32,46,.55);position:sticky;top:0;z-index:5}
header b{font-size:17px}header .r{margin-left:auto;font-size:12px;font-weight:600;color:var(--red);background:rgba(217,32,46,.08);padding:4px 10px;border-radius:99px;white-space:nowrap}
.logo{height:34px;width:34px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}
button,.btn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(217,32,46,.35);transition:transform .12s ease,background .15s ease,box-shadow .15s ease}
@media(hover:hover){button:hover{filter:brightness(.94)}}button:active{transform:scale(.97)}button:disabled{opacity:.55;cursor:default;transform:none}
button.g{background:#fff;color:var(--tx);border:1px solid var(--bd);box-shadow:none}@media(hover:hover){button.g:hover{background:#f3f4f7}}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);font-size:16px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 3px rgba(217,32,46,.14)}
input[type=checkbox]{width:auto;accent-color:var(--red)}input::placeholder{color:#9aa1ad}
label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin:12px 0 5px;letter-spacing:.01em}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.login{max-width:380px;margin:11vh auto}.login .box{padding:26px 22px;border-radius:24px;box-shadow:0 16px 50px rgba(16,24,40,.12)}
.paybox{border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:12px;background:var(--card)}.pb-h{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin-bottom:8px}.pb-h span b{color:var(--red);font-size:18px}.pb-chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-bottom:8px}.pb-chips button{width:auto;padding:5px 12px;border-radius:20px;font-size:12.5px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.pb-chips button.on{background:var(--red);color:#fff;border-color:var(--red)}.pb-r{display:flex;gap:8px;align-items:center;margin:6px 0}.pb-r span{width:78px;font-size:14px;font-weight:600}.pb-r input{flex:1;min-width:0}.pb-r button{width:auto}#pb-txn{margin:4px 0 8px}.pb-up{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btnl{display:inline-block;padding:8px 12px;border:1px dashed var(--bd);border-radius:10px;font-size:13px;cursor:pointer;font-weight:600;color:var(--tx)}.pb-s{margin-top:10px;font-size:14px;padding-top:8px;border-top:1px dashed var(--bd)}
.pay-wrap{display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:22px;align-items:start;margin-top:14px}.pay-wrap.cmp{grid-template-columns:1fr}.pay-qr{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:16px;text-align:center;box-shadow:var(--sh)}.pay-qr svg{max-width:100%;height:auto}.pq-t{font-weight:800;letter-spacing:.1em;color:#d9202e;margin-top:6px}.pq-id{font-size:13.5px;margin:4px 0 8px;color:#14171c;word-break:break-all}.pay-btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.pay-btns button{width:auto;padding:7px 12px;font-size:13px}.pay-s{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--red);border-radius:14px;padding:12px 16px;margin-bottom:10px;font-size:14px;line-height:1.55}.pay-s h4{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px}.pay-s h4 i{font-style:normal;background:var(--red);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}.pay-s p{margin:4px 0}.pay-row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:4px 0 8px}.pay-row b{font-size:16px;word-break:break-all}.pay-row button{width:auto}.pay-d{margin-top:14px;border:1px solid var(--bd);border-radius:14px;padding:10px 14px;background:var(--card)}.pay-d summary{cursor:pointer;font-weight:800;font-size:15px}@media(max-width:760px){.pay-wrap{grid-template-columns:1fr}}
#ctip{position:fixed;z-index:9999;pointer-events:none;background:#181a20;color:#fff;padding:8px 11px;border-radius:10px;font-size:12.5px;line-height:1.5;box-shadow:0 8px 26px #0005;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:240px}#ctip.on{opacity:1;transform:none}.chx.hv [data-g]:not(.hit):not(.gl){opacity:.32;transition:opacity .1s}.chx.hv [data-g].on:not(.hit):not(.gl){opacity:1}.chx .gl{opacity:0}.chx .gl.on{opacity:.3!important}.chx circle[data-g].on{stroke-width:30}.chx circle[data-g]{transition:stroke-width .1s}.chx .hit{cursor:crosshair}
.fcb{margin-left:8px;padding:5px 12px;width:auto;font-size:12.5px;border-radius:20px;background:#12a150;color:#fff;border:0;font-weight:700;cursor:pointer}.fcb.out{background:#c0262d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}.stat span{font-size:11.5px;line-height:1.15;display:block}@media(min-width:900px){.stats{grid-template-columns:repeat(8,1fr)}}@media(max-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 6px;text-align:center;box-shadow:var(--sh);transition:transform .12s,box-shadow .15s;cursor:pointer}.stat:active{transform:scale(.97)}
.stat.on{box-shadow:0 0 0 2px var(--red),var(--sh)}.stat b{font-size:24px;display:block;line-height:1.15}.stat span{font-size:11.5px;color:var(--mut);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
.id{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);transition:transform .15s ease,box-shadow .2s ease;content-visibility:auto;contain-intrinsic-size:auto 170px}
.id:active{transform:scale(.985)}@media(hover:hover){.id:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(16,24,40,.12)}}
.id .top{background:linear-gradient(135deg,#b81a27,#e5303f);color:#fff;padding:9px 16px;font-size:11.5px;font-weight:700;letter-spacing:.1em;display:flex;justify-content:space-between}
.id .bd{display:flex;gap:14px;padding:14px 16px}
.ph{width:78px;height:98px;border-radius:14px;background:#eceef3;object-fit:cover;flex:none}
.id h3{margin:0 0 2px;font-size:17px;letter-spacing:-.01em}.id p{margin:0;color:var(--mut);font-size:13px}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;margin-top:7px}
.bar{height:6px;background:#edeff4;margin:0 16px 16px;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;transition:width .4s ease}
.days{padding:0 16px 9px;font-size:13px;display:flex;justify-content:space-between;color:var(--mut)}.days b{font-size:20px;color:var(--tx)}
.modal{position:fixed;inset:0;background:rgba(15,18,25,.45);display:grid;place-items:center;padding:14px;z-index:40;overflow:auto;overscroll-behavior:contain;animation:fd .15s ease}
.modal .box{max-height:92vh;max-height:92dvh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;overflow:auto;width:100%;max-width:440px;box-shadow:0 24px 70px rgba(16,24,40,.28);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(18px);opacity:0}}
@media(max-width:560px){.modal{place-items:end center;padding:0}.modal .box{max-width:none;border-radius:24px 24px 0 0;max-height:94vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}.stat b{font-size:21px}.w{padding:12px 12px 36px}.grid{grid-template-columns:1fr}}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:13px;color:var(--mut);margin-top:8px}.err{color:var(--red)}td,th{padding:8px 6px;border-top:1px solid var(--bd)}th{font-weight:600}
.modal #x,.modal #idb,.modal #ivb,.modal #rn,.modal #del{flex:1 1 104px!important}.cw{margin:12px 0}.cw-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.cw-h button{padding:4px 14px;font-size:18px;line-height:1.2}.cw-w,.cw-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cw-w span{font-size:11px;color:var(--mut);font-weight:700}.cw-d{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:12.5px;color:var(--tx)}.cw-d.o{color:#c4c8d0}.cw-d.v{border:1.5px solid #cfd3db}.cw-d.a{background:var(--red);color:#fff;font-weight:700}.cw-d.s{background:#14171c;color:#fff;font-weight:700}.cw-d.e{border:2.5px solid #14171c;font-weight:800}.cw-l{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px;align-items:center}.cw-l i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1.5px solid #cfd3db}.cw-l i.a{background:var(--red);border-color:var(--red)}.cw-l i.s{background:#14171c;border-color:#14171c}.cw-l i.e{border:2.5px solid #14171c}

["📜","Membership &amp; Payments",["Memberships are strictly <b>non-transferable</b> and <b>non-refundable</b>.","Memberships are <b>unpausable</b>. A plan cannot be paused, frozen or extended under any circumstance.","Your invoice (PDF or printed receipt) is the only proof and acts as your licence to use the gym within the validity dates printed on it.","Please clear any pending balance within <b>3 days of paying</b>. If it is not cleared in time, the payment may be forfeited, the membership may be terminated and the pending amount may no longer be accepted.","Always verify that the banking name is <b>RED CROSS GYM</b> before paying by UPI, and never pay cash without collecting an official RED CROSS GYM receipt.","Never pay into an employee's or member's personal account. Such payments are unauthorised, the management takes no responsibility for them, and strict legal action will be taken against both sender and receiver.","<b>Personal Training</b> is an add-on service: it needs an <b>active gym membership</b>, cannot start before it or run past its end date, and uses the same registered mobile number. It is paid in full at booking, and its invoice shows your active membership details.","Students and senior citizens get a flat <b>20% discount</b> on regular plans only, not on any offer price. ID proof is required.","A recent photo of every member is mandatory for the ID card and for identity checks at the desk."]],
["🗓","Attendance &amp; Timings",["Only <b>one check-in and one check-out</b> are allowed per day.","If a member stays absent for <b>30 straight days</b>, the membership may be terminated without refund.","Gym timings are fixed: <b>6:00 AM to 1:00 PM</b> and <b>5:00 PM to 10:00 PM</b> (Unisex), <b>1:00 PM to 5:00 PM</b> (Ladies-Only), Monday to Saturday. Closed on Sundays. Late entries may not be permitted.","Please check the Announcement Group before you leave home for schedule changes, weather disruptions or maintenance."]],
["🏋️","Gym Rules",["Proper gym attire is mandatory: workout clothing and gym shoes.","Use equipment responsibly. Members are liable for damage caused by negligence.","Personal training by outsiders is prohibited. Only certified Red Cross Gym trainers may train members.","Lockers are temporarily unavailable. The gym is not responsible for lost or stolen belongings.","Members must disclose any medical condition. The gym is not liable for injuries, accidents or health issues arising during workouts.","Misconduct, including rude, aggressive or inappropriate behaviour, will result in immediate termination of the membership.","Management may amend rules and policies without prior notice."]],
["🧼","Hygiene Protocol",["Wear clean socks and fresh, fully dried clothes every session.","Use deodorant or fragrance. Body odour is not acceptable in a shared fitness space.","Bring a separate, clean pair of gym-only shoes. No outside shoes inside the gym.","Carry a towel. Wipe off your sweat and wipe the equipment after every set.","Chewing gum is strictly banned in urinals and sanitary areas. Dispose of it responsibly.","A hygiene complaint from staff or a member can lead to immediate termination, with no notice and no refund. If you see a violation, report it to a staff member or in the group."]],
["👥","Children &amp; Guests",["Children are not allowed inside the gym premises. If you bring a child, neither of you will be permitted entry.","Relatives and friends are not allowed without an active membership. Non-members may buy a <b>Guest Pass for ₹99 per day</b>, valid for up to 90 minutes."]],
["💬","Community Group Rules",["The <b>Members Discussion Group</b> is for active members only. Keep it respectful and limited to gym, fitness, health and nutrition topics.","Promotions, forwarded messages and personal remarks are not permitted.","Religious greetings, comments or forwards of any faith are strictly prohibited and treated as a serious violation.","Equipment demands or complaints will not be entertained. We keep improving as funds and membership cost allow.","Repeated violations follow a <b>three-strike system</b>. After three warnings you may be removed from the group and your membership may be cancelled.","Official offers and updates are posted in the Announcement &amp; Community Group. Check it often."]]];

/* cross-device keyboard and input helpers */
(function(){

  var wz=Q(".wz"),sheet=Q("#washeet");

  if(k==="Escape"){
   if(sheet){e.preventDefault();sheet.remove();return}
   var ms=[].filter.call(document.querySelectorAll(".modal"),function(m){return m.style.display!=="none"});
   if(ms.length){var m=ms[ms.length-1],cb=[].find.call(m.querySelectorAll("button"),function(b){return/^\s*(✕|×|close|cancel|back)\b/i.test(b.textContent)||b.id==="cx"});e.preventDefault();if(cb)cb.click();else m.remove();return}

  }
