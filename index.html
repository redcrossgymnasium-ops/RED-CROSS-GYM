<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red Cross Gym</title>
<meta name="theme-color" content="#d9202e"><meta name="apple-mobile-web-app-capable" content="yes"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#17181c;--mut:#6b6f7a;--red:#d9202e;--bd:#e4e5ea;--ok:#12a150;--warn:#d98a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111214;--card:#1b1c20;--tx:#f2f2f4;--mut:#9a9eaa;--bd:#2c2e35}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:3px solid var(--red);position:sticky;top:0;z-index:5}
header b{font-size:17px}header .r{margin-left:auto;font-size:12px;color:var(--mut)}
.logo{height:34px;width:34px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}
button,.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px;font-family:inherit}
label{font-size:12px;color:var(--mut);display:block;margin:10px 0 4px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
.login{max-width:360px;margin:12vh auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:12px}
.id{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer}
.id .top{background:linear-gradient(135deg,#b3121f,#e3283a);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.08em;display:flex;justify-content:space-between}
.id .bd{display:flex;gap:12px;padding:14px}
.ph{width:78px;height:96px;border-radius:10px;background:var(--bd);object-fit:cover;flex:none}
.id h3{margin:0 0 2px;font-size:17px}.id p{margin:0;color:var(--mut);font-size:13px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;margin-top:6px}
.bar{height:6px;background:var(--bd);margin:0 14px 14px;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%}
.days{padding:0 14px 8px;font-size:13px;display:flex;justify-content:space-between}.days b{font-size:20px}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:14px;z-index:40;overflow:auto}
.modal .box{width:100%;max-width:420px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:13px;color:var(--mut);margin-top:8px}.err{color:var(--red)}td,th{padding:7px 4px;border-top:1px solid var(--bd)}
</style></head><body>
<div id="app"></div>
<script>
window.RCG_API="https://script.google.com/macros/s/AKfycbykxXy_Pl-aVSvDwsvz5LypKS0VUYFr5bfwr6Ef8OCDab5y9eH7VRCpqiAHvvheiT4q/exec"; /* paste your Apps Script web app URL here once, then host this file anywhere */

const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pd=s=>{const m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s||"");return m?new Date(+m[3],m[2]-1,+m[1]):null};
const fmt=d=>d?d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"–";
function info(m){const s=pd(m.start),e=pd(m.end),t=new Date();t.setHours(0,0,0,0);
 const left=e?Math.round((e-t)/864e5)+1:0,tot=s&&e?Math.max(1,Math.round((e-s)/864e5)+1):1;
 const notStarted=s&&s>t;let st=left<=0?["Expired","#c0262d"]:left<=7?["Expiring soon","#d98a00"]:["Active","#12a150"];
 if(notStarted)st=["Upcoming","#2563eb"];
 return{left:Math.max(0,left),pct:Math.max(0,Math.min(100,left/tot*100)),st}}
/* storage: Google Drive via Apps Script */
let API=(window.RCG_API||"").trim()||ls.g("rcg_api")||"",creds=null;
async function api(body){const r=await fetch(API,{method:"POST",body:JSON.stringify({...creds,...body})});return r.json()}
function apply(d){members=Object.values(d||{});ls.s("rcg_cache",JSON.stringify(members))}
async function refresh(){if(!creds&&mphone&&API){try{const r=await mfetch(mphone);if(r.members){mmem=r.members;ls.s("rcg_mcache",JSON.stringify(mmem));render()}}catch(e){}return}if(!creds||!API)return;try{const r=await api({action:"list"});if(r.members){apply(r.members);attm=r.att||attm;render()}}catch(e){}}
async function initStore(){try{members=JSON.parse(ls.g("rcg_cache")||"[]")}catch(e){}
 store={set:async m=>{const r=await api({action:"set",member:m});if(r.error)throw 0;await refresh()},del:async id=>{const r=await api({action:"del",id});if(r.error)throw 0;await refresh()}};
 setInterval(()=>{if(!document.querySelector(".modal"))refresh()},30000)}

<label>Phone number</label><input id="mp" type="tel" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile number"><div class="msg err">${msg||""}</div>
<button type="submit" style="width:100%;margin-top:12px" id="mg">View my card</button><div style="text-align:center;margin-top:16px"><a href="#" id="bk2" style="color:var(--red);font-weight:600;font-size:14px">Staff / Owner login</a></div></form></div>`;
 $("#bk2").onclick=e=>{e.preventDefault();loginView()};setTimeout(()=>{const f=$("#mp");if(f)f.focus()},50);
 $("#mf").onsubmit=async e=>{e.preventDefault();const p=$("#mp").value.replace(/\D/g,"").slice(-10);if(p.length<10)return memberLogin("Enter a valid 10-digit number");
  if(!API)return memberLogin("App is not set up yet. Ask the gym.");$("#mg").textContent="Checking…";
  try{const r=await mfetch(p);if(r.error)return memberLogin("Member login is not enabled yet. Please tell the gym (script update needed).");if(!r.members||!r.members.length)return memberLogin("Number not found. Please check with the gym.");mphone=p;mmem=r.members;ls.s("rcg_member",p);ls.s("rcg_mcache",JSON.stringify(mmem));render()}catch(x){memberLogin("Cannot reach server. Check your internet.")}}}
function mcard(m){const i=info(m),c=i.st[1];return`<div class="id" style="cursor:default;max-width:520px;margin:14px auto;border:6px solid ${c};border-radius:22px;box-shadow:0 8px 30px #0003">
<div class="top" style="font-size:15px;padding:10px 18px"><span>RED CROSS GYM</span><span>MEMBER</span></div>
<div style="text-align:center;padding:16px 16px 6px"><img src="${esc(m.photo||"")}" alt="" style="width:min(80vw,340px);aspect-ratio:4/5;object-fit:cover;border-radius:16px;background:var(--bd);border:3px solid ${c}">
<h1 style="margin:14px 0 8px;font-size:clamp(28px,8vw,44px);line-height:1.1">${esc(m.name)}</h1>
<span class="pill" style="background:${c};font-size:clamp(22px,6vw,32px);padding:6px 26px;margin:0">${i.st[0].toUpperCase()}</span>
<div style="margin-top:12px"><b style="font-size:clamp(56px,18vw,96px);line-height:1;color:${c}">${i.left}</b><div style="font-size:clamp(18px,5vw,26px);font-weight:700">days remaining</div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 18px;text-align:center"><div style="background:var(--bg);border-radius:12px;padding:10px"><div class="msg" style="margin:0">JOINING DATE</div><b style="font-size:clamp(17px,4.6vw,24px)">${fmt(pd(m.start))}</b></div><div style="background:var(--bg);border-radius:12px;padding:10px"><div class="msg" style="margin:0">EXPIRY DATE</div><b style="font-size:clamp(17px,4.6vw,24px)">${fmt(pd(m.end))}</b></div></div></div>`}
function adt(x){const[a,b]=x.split(" "),[y,mo,d]=a.split("-").map(Number),[h,mi]=b.split(":").map(Number);return new Date(y,mo-1,d,h,mi)}
function fmtA(x){const d=adt(x);return[d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}),d.toLocaleDateString("en-GB",{weekday:"long"}),d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:true})]}
function astats(list){const pad=n=>String(n).padStart(2,"0"),key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
 const ds=list.map(x=>x.slice(0,10)),set=new Set(ds),now=new Date(),ym=now.getFullYear()+"-"+pad(now.getMonth()+1);
 let c=new Date(now.getFullYear(),now.getMonth(),now.getDate());const today=set.has(key(c));if(!today)c.setDate(c.getDate()-1);let streak=0;while(set.has(key(c))){streak++;c.setDate(c.getDate()-1)}
 return{month:ds.filter(x=>x.startsWith(ym)).length,streak,total:set.size,today}}
function asum(id){const l=(attm[id]||[]).slice().sort().reverse();if(!l.length)return"Attendance: none yet";const s=astats(l),f=fmtA(l[0]);return`Attendance: <b>${s.month}</b> days this month · <b>${s.total}</b> total · streak <b>${s.streak}</b><br>Last visit: <b>${f[1]}, ${f[0]} ${f[2]}</b>`}
function matt(m){const list=(m.att||[]).slice().sort().reverse(),s=astats(list),st=info(m).st[0];let top;
 if(s.today){const f=fmtA(list[0]);top=`<div style="background:#12a15020;border:2px solid #12a150;border-radius:14px;padding:14px;text-align:center"><div style="font-size:22px;font-weight:800;color:#12a150">✔ Attendance marked today</div><div style="font-size:16px;margin-top:4px">${f[1]}, ${f[0]} · ${f[2]}</div></div>`}
 else if(st==="Expired"||st==="Upcoming")top='<div class="msg" style="text-align:center">Attendance can be marked only while the membership is active.</div>';
 else top=`<button data-mk="${esc(m.id||"")}" style="width:100%;padding:18px;font-size:20px;background:#12a150">✔ Mark today's attendance</button>`;
 const rows=list.slice(0,15).map(x=>{const f=fmtA(x);return`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td></tr>`}).join("");
 return`<div class="box" style="max-width:520px;margin:0 auto 18px">${top}<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0"><div class="stat"><b>${s.month}</b><span>This month</span></div><div class="stat"><b>${s.streak}</b><span>Day streak</span></div><div class="stat"><b>${s.total}</b><span>Total days</span></div></div>${rows?`<table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="text-align:left;color:var(--mut);font-size:12px"><th>DATE</th><th>DAY</th><th>TIME</th></tr>${rows}</table>`:'<p class="msg" style="text-align:center">No attendance yet.</p>'}</div>`}
async function mark(id,btn){btn.disabled=true;btn.textContent="Marking…";
 try{const r=await fetch(API,{method:"POST",body:JSON.stringify({action:"attend",phone:mphone,id})}).then(x=>x.json());
  if(r.error)alert(r.error==="expired"?"Membership expired. Please renew.":r.error==="notstarted"?"Membership has not started yet.":r.error==="auth"?"Attendance is not enabled yet. Please tell the gym.":"Could not mark attendance. Please tell the gym.");
  else{const m=mmem.find(x=>x.id===id);if(m)m.att=r.att;ls.s("rcg_mcache",JSON.stringify(mmem))}}
 catch(e){alert("Cannot reach server. Check your internet.")}render()}

<div class="w"><div class="stats"><div class="stat"><b>${members.length}</b><span>Members</span></div><div class="stat"><b style="color:var(--ok)">${c(x=>x.st[0]==="Active")}</b><span>Active</span></div><div class="stat"><b style="color:var(--warn)">${c(x=>x.st[0]==="Expiring soon")}</b><span>Expiring</span></div><div class="stat"><b style="color:#c0262d">${c(x=>x.st[0]==="Expired")}</b><span>Expired</span></div></div>

</div>`;
 const qi=$("#q");qi.oninput=e=>{q=e.target.value;render()};if(hasFocus){qi.focus();qi.setSelectionRange(q.length,q.length)}
 if($("#add"))$("#add").onclick=()=>addView();if($("#crmb"))$("#crmb").onclick=openCrm;
 $("#lo").onclick=()=>{if(confirm("Log out?")){ls.s("rcg_role","");ls.s("rcg_cred","");creds=null;role=null;render()}};
 if($("#bk"))$("#bk").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(members,null,1)],{type:"application/json"}));a.download="red-cross-gym-members-"+new Date().toISOString().slice(0,10)+".json";a.click()};
 document.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>detail(el.dataset.id))}
function card(m,i){return`<div class="id" data-id="${esc(m.id)}"><div class="top"><span>RED CROSS GYM</span><span>BIO ${esc(m.bio)}</span></div>
<div class="bd"><img class="ph" src="${esc(m.photo||"")}" alt=""><div><h3>${esc(m.name)}</h3><p>${esc(m.phone)}</p><p>${esc(m.plan)}</p><span class="pill" style="background:${i.st[1]}">${i.st[0]}</span></div></div>
<div class="days"><span>${fmt(pd(m.start))} → ${fmt(pd(m.end))}</span><span><b>${i.left}</b> days left</span></div><div class="bar"><i style="width:${i.pct}%;background:${i.st[1]}"></i></div></div>`}
function modal(h){const d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="box">${h}</div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d);return d}
function detail(id){const m=members.find(x=>x.id===id);if(!m)return;const i=info(m);
 const d=modal(`${card(m,i)}<div style="margin-top:12px;font-size:14px;line-height:1.8">Bill No: <b>${esc(m.bill)}</b> · ${esc(m.billDate)}<br>Total: <b>Rs. ${esc(m.total)}</b> · Paid: <b>Rs. ${esc(m.paid)}</b> · Due: <b>Rs. ${esc(m.due)}</b></div><div style="margin-top:6px;font-size:14px;line-height:1.8">${asum(m.id)}</div>
<div style="display:flex;gap:8px;margin-top:12px"><button class="g" style="flex:1" id="x">Close</button>${role==="owner"&&(i.st[0]==="Expired"||i.st[0]==="Expiring soon")?'<button style="flex:1" id="rn">Renew</button>':""}${role==="owner"?'<button style="flex:1;background:#8a1018" id="del">Delete</button>':""}</div>`);
 d.querySelector(".id").onclick=null;if(d.querySelector("#rn"))d.querySelector("#rn").onclick=()=>{d.remove();renewView(m)};d.querySelector("#x").onclick=()=>d.remove();
 if(role==="owner")d.querySelector("#del").onclick=async()=>{if(confirm("Delete "+m.name+"?")){await store.del(m.id);d.remove()}}}
/* renew member */
function renewView(m){let photo="";
 const d=modal(`<h3 style="margin:0 0 2px">Renew membership</h3><div class="msg" style="margin:0 0 6px">${esc(m.name)} · BIO ${esc(m.bio)}</div><label>New bill (PDF)</label><input type="file" id="f" accept="application/pdf">
<label>Latest photo (optional – old photo is kept if you skip)</label><div style="display:flex;gap:8px"><button type="button" class="g" style="flex:1" id="cb">📷 Take photo</button><button type="button" class="g" style="flex:1" id="gb">🖼 Gallery</button></div><input type="file" id="ph" accept="image/*" hidden><input type="file" id="cam" accept="image/*" capture="environment" hidden><img id="pv" alt="" style="display:none;width:70px;height:88px;object-fit:cover;border-radius:8px;margin-top:8px">
<div class="msg" id="st"></div><div id="form"></div>`);
 const st=x=>d.querySelector("#st").innerHTML=x;
 const F=[["name","Name"],["phone","Phone"],["plan","Plan"],["start","Start (dd/mm/yyyy)"],["end","End (dd/mm/yyyy)"],["bill","Bill No"],["billDate","Bill date"],["total","Total"],["paid","Paid"],["due","Due"]];
 let data={name:m.name,phone:m.phone};
 const draw=()=>{d.querySelector("#form").innerHTML=F.map(([k,l])=>`<label>${l}</label><input data-k="${k}" value="${esc(data[k])}">`).join("")+'<button style="width:100%;margin-top:14px" id="sv">Save renewal</button>';
  d.querySelector("#sv").onclick=async()=>{const v={};d.querySelectorAll("[data-k]").forEach(i=>v[i.dataset.k]=i.value.trim());
   if(!pd(v.start)||!pd(v.end)){st('<span class="err">Enter valid start and end dates (dd/mm/yyyy)</span>');return}

async function readPdf(file){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

 for(let p=1;p<=pdf.numPages;p++){const c=await(await pdf.getPage(p)).getTextContent();t+=c.items.map(x=>x.str).join("\n")+"\n"}
 const L=t.split("\n").map(s=>s.trim()).filter(Boolean),g=r=>(r.exec(t.replace(/\n/g," "))||[])[1]||"";
 const bi=L.findIndex(s=>/^BILL TO/i.test(s)),nm=bi>=0?L[bi+1]:"";
 const money=k=>(new RegExp(k+"\\s*Rs\\.?\\s*([\\d,]+)","i").exec(L.join(" "))||[])[1]?.replace(/,/g,"")||"";
 const dr=/From\s+(\d{1,2}\/\d{1,2}\/\d{4})\s+till\s+(\d{1,2}\/\d{1,2}\/\d{4})/i.exec(L.join(" "))||[];
 const pi=L.findIndex(s=>/membership/i.test(s)&&!/non-/i.test(s));
 return{name:nm,bio:g(/BIO ID:?\s*(\d+)/i),phone:g(/BIO ID:?\s*\d+\s+(\d{10})/i),bill:g(/Bill Number:?\s*(\d+)/i),billDate:g(/Bill Date:?\s*(\d{1,2}\/\d{1,2}\/\d{4})/i),
  plan:pi>=0?L[pi]:"",start:dr[1]||"",end:dr[2]||"",total:money("GRAND TOTAL"),paid:money("PAID AMOUNT"),due:money("DUE AMOUNT")}}
function tinyPhoto(file){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const W=160,H=200,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
 const s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);
 let q=.6,u=cv.toDataURL("image/jpeg",q);while(u.length>9000&&q>.25){q-=.1;u=cv.toDataURL("image/jpeg",q)}res(u)};im.onerror=rej;im.src=URL.createObjectURL(file)})}
