<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Red Cross Gym</title>
<meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light"><meta name="apple-mobile-web-app-capable" content="yes"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.0.3/qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mut:#6a7280;--red:#d9202e;--red2:#b81a27;--bd:#e8eaf0;--ok:#12a150;--warn:#d98a00;--sh:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(900px 260px at 50% -90px,rgba(217,32,46,.09),transparent),var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:1040px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(1.6) blur(12px);backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--bd);box-shadow:0 1px 0 rgba(217,32,46,.55);position:sticky;top:0;z-index:5}
header b{font-size:17px}header .r{margin-left:auto;font-size:12px;font-weight:600;color:var(--red);background:rgba(217,32,46,.08);padding:4px 10px;border-radius:99px;white-space:nowrap}
.logo{height:34px;width:34px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}
button,.btn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(217,32,46,.35);transition:transform .12s ease,background .15s ease,box-shadow .15s ease}
button:hover{background:var(--red2)}button:active{transform:scale(.97)}button:disabled{opacity:.55;cursor:default;transform:none}
button.g{background:#fff;color:var(--tx);border:1px solid var(--bd);box-shadow:none}button.g:hover{background:#f3f4f7}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);font-size:16px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 3px rgba(217,32,46,.14)}
input[type=checkbox]{width:auto;accent-color:var(--red)}input::placeholder{color:#9aa1ad}
label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin:12px 0 5px;letter-spacing:.01em}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.login{max-width:380px;margin:11vh auto}.login .box{padding:26px 22px;border-radius:24px;box-shadow:0 16px 50px rgba(16,24,40,.12)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4px 0 14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 6px;text-align:center;box-shadow:var(--sh);transition:transform .12s,box-shadow .15s;cursor:pointer}.stat:active{transform:scale(.97)}
.stat.on{box-shadow:0 0 0 2px var(--red),var(--sh)}.stat b{font-size:24px;display:block;line-height:1.15}.stat span{font-size:11.5px;color:var(--mut);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
.id{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);transition:transform .15s ease,box-shadow .2s ease;content-visibility:auto;contain-intrinsic-size:auto 170px}
.id:active{transform:scale(.985)}@media(hover:hover){.id:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(16,24,40,.12)}}
.id .top{background:linear-gradient(135deg,#b81a27,#e5303f);color:#fff;padding:9px 16px;font-size:11.5px;font-weight:700;letter-spacing:.1em;display:flex;justify-content:space-between}
.id .bd{display:flex;gap:14px;padding:14px 16px}
.ph{width:78px;height:98px;border-radius:14px;background:#eceef3;object-fit:cover;flex:none}
.id h3{margin:0 0 2px;font-size:17px;letter-spacing:-.01em}.id p{margin:0;color:var(--mut);font-size:13px}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;margin-top:7px}
.bar{height:6px;background:#edeff4;margin:0 16px 16px;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;transition:width .4s ease}
.days{padding:0 16px 9px;font-size:13px;display:flex;justify-content:space-between;color:var(--mut)}.days b{font-size:20px;color:var(--tx)}
.modal{position:fixed;inset:0;background:rgba(15,18,25,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:grid;place-items:center;padding:14px;z-index:40;overflow:auto;animation:fd .15s ease}
.modal .box{width:100%;max-width:440px;box-shadow:0 24px 70px rgba(16,24,40,.28);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(18px);opacity:0}}
@media(max-width:560px){.modal{place-items:end center;padding:0}.modal .box{max-width:none;border-radius:24px 24px 0 0;max-height:94vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}.stat b{font-size:21px}.w{padding:12px 12px 36px}.grid{grid-template-columns:1fr}}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:13px;color:var(--mut);margin-top:8px}.err{color:var(--red)}td,th{padding:8px 6px;border-top:1px solid var(--bd)}th{font-weight:600}
.modal #x,.modal #idb,.modal #ivb,.modal #rn,.modal #del{flex:1 1 104px!important}.net{background:#fff7e6;color:#8a5a00;text-align:center;font-size:12.5px;padding:6px 10px;border-bottom:1px solid #f3dfb2}.net[hidden]{display:none}
.sk{border-radius:20px;background:linear-gradient(90deg,#eceef3 25%,#f7f8fa 37%,#eceef3 63%);background-size:400% 100%;animation:sk 1.3s ease infinite}@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:#14171c;color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.25)}#toast.on{opacity:1;transform:translate(-50%,0)}
button{white-space:nowrap}a{text-decoration:none}@media(max-width:480px){header{gap:6px;padding:8px 10px}header img{height:28px!important}header .r{font-size:10.5px;padding:3px 7px}header button{padding:6px 9px!important;font-size:12px!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div>
<script>
window.RCG_API="https://script.google.com/macros/s/AKfycbykxXy_Pl-aVSvDwsvz5LypKS0VUYFr5bfwr6Ef8OCDab5y9eH7VRCpqiAHvvheiT4q/exec"; /* paste your Apps Script web app URL here once, then host this file anywhere */
const $=s=>document.querySelector(s),app=$("#app");
let role=null,members=[],flt="all",q="",db=null,store=null,mphone=null,mbio="",mmem=[],attm={};
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pd=s=>{const m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s||"");return m?new Date(+m[3],m[2]-1,+m[1]):null};
const fmt=d=>d?d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"–";
function info(m){const s=pd(m.start),e=pd(m.end),t=new Date();t.setHours(0,0,0,0);
 const left=e?Math.round((e-t)/864e5)+1:0,tot=s&&e?Math.max(1,Math.round((e-s)/864e5)+1):1;
 const notStarted=s&&s>t;let st=left<=0?["Expired","#c0262d"]:left<=7?["Expiring soon","#d98a00"]:["Active","#12a150"];
 if(notStarted)st=["Upcoming","#2563eb"];
 return{left:Math.max(0,left),pct:Math.max(0,Math.min(100,left/tot*100)),st}}
/* storage: Google Drive via Apps Script */
let API=(window.RCG_API||"").trim()||ls.g("rcg_api")||"",creds=null;
const post=(body,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||25000);return fetch(API,{method:"POST",body:JSON.stringify(body),signal:c.signal}).then(r=>r.json()).finally(()=>clearTimeout(t))};
async function api(body){return post({...creds,...body})}
function apply(d){members=Object.values(d||{});ls.s("rcg_cache",JSON.stringify(members))}
let loading=false,lastSig="",netBad=false,lim=60,tm=0,synced=false,lastExpi=[];
const SK=[1,2,3,4,5,6].map(()=>'<div class="sk" style="height:150px"></div>').join("");
function toast(t){let e=$("#toast");if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e)}e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2200)}
function setNet(b){if(netBad===b)return;netBad=b;const n=$("#net");if(n)n.hidden=!b}
async function refresh(){
 if(!creds&&mphone&&API){try{const r=await mfetch(mphone,mbio);if(r.members){setNet(false);const sig=JSON.stringify(r.members);if(sig!==lastSig){lastSig=sig;mmem=r.members;ls.s("rcg_mcache",sig);render()}}}catch(e){setNet(true)}return}
 if(!creds||!API)return;
 try{const r=await api({action:"list"});if(r.members){const was=loading,sig=JSON.stringify([r.members,r.att||0]);loading=false;setNet(false);if(sig!==lastSig||was){lastSig=sig;apply(r.members);attm=r.att||attm;render()}if(role==="owner"&&!synced){synced=true;setTimeout(async()=>{try{const n=await syncBills();if(n)toast(n+" member bills added to Sales")}catch(e){}},1500)}}}catch(e){setNet(true)}}
async function initStore(){try{members=JSON.parse(ls.g("rcg_cache")||"[]")}catch(e){}
 store={set:async m=>{const r=await api({action:"set",member:m});if(r.error)throw 0;await refresh()},del:async id=>{const r=await api({action:"del",id});if(r.error)throw 0;await refresh()}};
 setInterval(()=>{if(!document.hidden&&!document.querySelector(".modal"))refresh()},45000);document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!document.querySelector(".modal"))refresh()})}
/* member area */
const mfetch=(p,b)=>post({action:"member",phone:p,bio:b});
function mcard(m){const i=info(m),c=i.st[1];return`<div class="id" style="cursor:default;max-width:520px;margin:14px auto;border:6px solid ${c};border-radius:22px;box-shadow:0 8px 30px #0003">
<div class="top" style="font-size:15px;padding:10px 18px"><span>RED CROSS GYM</span><span>MEMBER</span></div>
<div style="text-align:center;padding:16px 16px 6px"><img src="${esc(m.photo||"")}" alt="" style="width:min(80vw,340px);aspect-ratio:4/5;object-fit:cover;border-radius:16px;background:var(--bd);border:3px solid ${c}">
<h1 style="margin:14px 0 8px;font-size:clamp(28px,8vw,44px);line-height:1.1">${esc(m.name)}</h1>
<span class="pill" style="background:${c};font-size:clamp(22px,6vw,32px);padding:6px 26px;margin:0">${i.st[0].toUpperCase()}</span>
<div style="margin-top:12px"><b style="font-size:clamp(56px,18vw,96px);line-height:1;color:${c}">${i.left}</b><div style="font-size:clamp(18px,5vw,26px);font-weight:700">days remaining</div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 18px;text-align:center"><div style="background:var(--bg);border-radius:12px;padding:10px"><div class="msg" style="margin:0">JOINING DATE</div><b style="font-size:clamp(17px,4.6vw,24px)">${fmt(pd(m.start))}</b></div><div style="background:var(--bg);border-radius:12px;padding:10px"><div class="msg" style="margin:0">EXPIRY DATE</div><b style="font-size:clamp(17px,4.6vw,24px)">${fmt(pd(m.end))}</b></div></div></div>`}
function adt(x){const[a,b]=x.split(" "),[y,mo,d]=a.split("-").map(Number),[h,mi]=b.split(":").map(Number);return new Date(y,mo-1,d,h,mi)}
function fmtA(x){const d=adt(x);return[d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}),d.toLocaleDateString("en-GB",{weekday:"long"}),d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:true})]}
function astats(list){const pad=n=>String(n).padStart(2,"0"),key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
 const ds=list.map(x=>x.slice(0,10)),set=new Set(ds),now=new Date(),ym=now.getFullYear()+"-"+pad(now.getMonth()+1);
 let c=new Date(now.getFullYear(),now.getMonth(),now.getDate());const today=set.has(key(c));if(!today)c.setDate(c.getDate()-1);let streak=0;while(set.has(key(c))){streak++;c.setDate(c.getDate()-1)}
 return{month:ds.filter(x=>x.startsWith(ym)).length,streak,total:set.size,today}}
function asum(id){const l=(attm[id]||[]).slice().sort().reverse();if(!l.length)return"Attendance: none yet";const s=astats(l),f=fmtA(l[0]);return`Attendance: <b>${s.month}</b> days this month · <b>${s.total}</b> total · streak <b>${s.streak}</b><br>Last visit: <b>${f[1]}, ${f[0]} ${f[2]}</b>`}
function matt(m){const list=(m.att||[]).slice().sort().reverse(),s=astats(list),st=info(m).st[0];let top;
 if(s.today){const f=fmtA(list[0]);top=`<div style="background:#12a15020;border:2px solid #12a150;border-radius:14px;padding:14px;text-align:center"><div style="font-size:22px;font-weight:800;color:#12a150">✔ Attendance marked today</div><div style="font-size:16px;margin-top:4px">${f[1]}, ${f[0]} · ${f[2]}</div></div>`}
 else if(st==="Expired"||st==="Upcoming")top='<div class="msg" style="text-align:center">Attendance can be marked only while the membership is active.</div>';
 else top=`<button data-mk="${esc(m.id||"")}" style="width:100%;padding:18px;font-size:20px;background:#12a150">✔ Mark today's attendance</button>`;
 const rows=list.slice(0,15).map(x=>{const f=fmtA(x);return`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td></tr>`}).join("");
 return`<div class="box" style="max-width:520px;margin:0 auto 18px">${top}<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0"><div class="stat"><b>${s.month}</b><span>This month</span></div><div class="stat"><b>${s.streak}</b><span>Day streak</span></div><div class="stat"><b>${s.total}</b><span>Total days</span></div></div>${rows?`<table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="text-align:left;color:var(--mut);font-size:12px"><th>DATE</th><th>DAY</th><th>TIME</th></tr>${rows}</table>`:'<p class="msg" style="text-align:center">No attendance yet.</p>'}</div>`}
async function mark(id,btn){btn.disabled=true;btn.textContent="Marking…";
 try{const r=await post({action:"attend",phone:mphone,bio:mbio,id});
  if(r.error)alert(r.error==="expired"?"Membership expired. Please renew.":r.error==="notstarted"?"Membership has not started yet.":r.error==="auth"?"Attendance is not enabled yet. Please tell the gym.":"Could not mark attendance. Please tell the gym.");
  else{const m=mmem.find(x=>x.id===id);if(m)m.att=r.att;ls.s("rcg_mcache",JSON.stringify(mmem))}}
 catch(e){alert("Cannot reach server. Check your internet.")}render()}
function tick(){const el=$("#clk");if(!el)return;const n=new Date();$("#cdt").textContent=n.toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});el.textContent=n.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true})}

function listPart(){const l=members.map(m=>({m,i:info(m)})).filter(x=>(x.m.name+x.m.bio+x.m.phone).toLowerCase().includes(q.toLowerCase())&&(flt==="all"||x.i.st[0]===flt)).sort((a,b)=>a.i.left-b.i.left);return{n:l.length,html:l.slice(0,lim).map(({m,i})=>card(m,i)).join("")+(l.length>lim?`<button class="g" id="more" style="grid-column:1/-1">Show more (${l.length-lim})</button>`:"")||'<p class="msg">No members in this list.</p>'}}
function bindCards(){document.querySelectorAll("#lst [data-id]").forEach(el=>el.onclick=()=>detail(el.dataset.id));const mb=$("#more");if(mb)mb.onclick=()=>{lim+=60;const P=listPart();$("#lst").innerHTML=P.html;bindCards()}}
function card(m,i){return`<div class="id" data-id="${esc(m.id)}"><div class="top"><span>RED CROSS GYM</span><span>BIO ${esc(m.bio)}</span></div>
<div class="bd"><img class="ph" loading="lazy" decoding="async" src="${esc(m.photo||"")}" alt=""><div><h3>${esc(m.name)}</h3><p>${esc(m.phone)}</p><p>${esc(m.plan)}</p><span class="pill" style="background:${i.st[1]}">${i.st[0]}</span></div></div>
<div class="days"><span>${fmt(pd(m.start))} → ${fmt(pd(m.end))}</span><span><b>${i.left}</b> days left</span></div><div class="bar"><i style="width:${i.pct}%;background:${i.st[1]}"></i></div></div>`}
function modal(h){const d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="box">${h}</div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d);return d}
function detail(id){const m=members.find(x=>x.id===id);if(!m)return;const i=info(m);
 const d=modal(`${card(m,i)}<div style="margin-top:12px;font-size:14px;line-height:1.8">Bill No: <b>${esc(m.bill)}</b> · ${esc(m.billDate)}<br>Total: <b>Rs. ${esc(m.total)}</b> · Paid: <b>Rs. ${esc(m.paid)}</b> · Due: <b>Rs. ${esc(m.due)}</b></div><div style="margin-top:6px;font-size:14px;line-height:1.8">${asum(m.id)}</div>

 d.querySelector(".id").onclick=null;d.querySelector("#idb").onclick=()=>idCard(m);if(d.querySelector("#ivb"))d.querySelector("#ivb").onclick=()=>receipt(rcFromMember(m));if(d.querySelector("#rn"))d.querySelector("#rn").onclick=()=>{d.remove();renewView(m)};d.querySelector("#x").onclick=()=>d.remove();

  d.querySelector("#form").innerHTML=`<label>Name</label><input id="nm"><label>BIO ID</label><input id="bo" value="${esc(data.bio)}"><label>Phone (10 digits)</label><input id="ph2" type="tel">
<label>Package</label><select id="pk" style="${sel}"><option>Custom</option>${allPk().map(p=>`<option>${esc(p.name)}</option>`).join("")}</select><label>Plan name (for Custom)</label><input id="pn">
<label>Joining date 📅</label><input type="date" id="jd" value="${iso(new Date())}"><label>Duration (days)</label><input type="number" id="dy" min="0"><label>End date 📅</label><input type="date" id="ed">
<label>Price (Rs.) – you can change it</label><input type="number" id="pr" min="0"><label>Discount (Rs. or %, e.g. 500 or 10%)</label><input id="dc"><label>Registration fee (Rs.)</label><input type="number" id="rf" value="0" min="0">
<label>Amount paid now (blank = full)</label><input type="number" id="pa" min="0"><label>Payment mode</label><select id="md" style="${sel}"><option>UPI</option><option>Cash</option><option>Card</option></select>
<div id="sum" class="box" style="margin-top:12px;font-size:14px;line-height:1.7"></div><button style="width:100%;margin-top:14px" id="sv">Save member &amp; create invoice</button>`;
  const calc=()=>{const price=+q("pr").value||0,rf=+q("rf").value||0,ds=q("dc").value.trim();let dc=ds.endsWith("%")?price*(parseFloat(ds)||0)/100:(+ds||0);dc=Math.round(Math.min(Math.max(dc,0),price)*100)/100;
   const grand=Math.max(0,price-dc+rf),paid=q("pa").value===""?grand:+q("pa").value,due=Math.max(0,Math.round((grand-paid)*100)/100);
   q("sum").innerHTML=`Sub-total <b>${R2(price)}</b> · Discount <b>${R2(dc)}</b> · Reg. fee <b>${R2(rf)}</b><br>Grand total <b>${R2(grand)}</b> · Paid <b>${R2(paid)}</b> · Due <b>${R2(due)}</b><br>Valid from <b>${q("jd").value?dm(q("jd").value):"-"}</b> till <b>${q("ed").value?dm(q("ed").value):"-"}</b>`;return{price,dc,rf,grand,paid,due}};
  const setEnd=()=>{if(q("jd").value&&q("dy").value!=="")q("ed").value=addD(q("jd").value,+q("dy").value);calc()};
  q("pk").onchange=()=>{const p=allPk().find(x=>x.name===q("pk").value);if(p){q("pn").value=p.name;q("pr").value=p.price;q("dy").value=p.days}setEnd()};
  q("jd").onchange=setEnd;q("dy").oninput=setEnd;q("ed").onchange=()=>{if(q("jd").value&&q("ed").value)q("dy").value=difD(q("jd").value,q("ed").value);calc()};
  ["pr","dc","rf","pa"].forEach(i=>q(i).oninput=calc);calc();
  q("sv").onclick=async()=>{const c=calc(),m={name:q("nm").value.trim(),bio:q("bo").value.trim(),phone:q("ph2").value.trim()},bill=data.bill;
   if(!m.name){st('<span class="err">Enter the name</span>');return}if(!m.bio){st('<span class="err">Enter a BIO ID</span>');return}if(members.some(x=>x.id==="m"+m.bio)){st('<span class="err">This BIO ID already exists</span>');return}
   if(!q("jd").value||!q("ed").value||q("ed").value<q("jd").value){st('<span class="err">Check the joining and end dates</span>');return}if(!photo){st('<span class="err">Please add the member photo</span>');return}
   const pn=q("pk").value==="Custom"?(q("pn").value.trim()||"Membership"):q("pk").value,mode=q("md").value;
   Object.assign(m,{plan:pn,start:dm(q("jd").value),end:dm(q("ed").value),bill,billDate:toD(new Date()),price:String(c.price),disc:String(c.dc),reg:String(c.rf),total:String(c.grand),paid:String(c.paid),due:String(c.due),mode:mode==="UPI"?"Online":mode,id:"m"+m.bio,photo,added:Date.now()});
   await fin(m,{id:"enr"+m.bio+"-"+bill,date:todayS(),customer:m.name,memberId:m.id,item:pn,type:/personal training/i.test(pn)?"PT":"Membership",amount:c.paid,discount:c.dc,mode,inv:"RCG-"+String(bill).padStart(4,"0"),ref:"b"+m.id+"-"+bill})}};
 q("nb").onclick=async()=>{await ensureCrm();data={bio:newBio(),bill:String(billNo())};st("Pick a package – dates, days and totals fill in automatically.");drawM()};
 q("f").onchange=async e=>{const f=e.target.files[0];if(!f)return;st("Reading bill…");
  try{data=await readPdf(f)}catch(x){data={};st('<span class="err">Could not read PDF – fill details manually.</span>')}
  if(data.name)st(data._meta?"Invoice read exactly. Check details, add the photo, then save.":"Bill read. Check details, then save. The bill file is not stored.");
  draw()}}

(async()=>{await initStore();try{creds=JSON.parse(ls.g("rcg_cred")||"null")}catch(e){}role=creds&&API?ls.g("rcg_role"):null;loading=!!role&&!members.length;if(!role){mphone=ls.g("rcg_member")||null;mbio=ls.g("rcg_mbio")||"";if(!mbio)mphone=null;try{mmem=JSON.parse(ls.g("rcg_mcache")||"[]")}catch(e){}}render();refresh()})();
